[base]
image = "ubuntu:24.04"

[toolchain]
install = """
set -eu

apt-get update
apt-get install -y --no-install-recommends \
  wget \
  gnupg \
  ca-certificates \
  build-essential \
  git \
  curl \
  inotify-tools

# Add Erlang Solutions repo (provides OTP + Elixir)
wget -qO- https://packages.erlang-solutions.com/ubuntu/erlang_solutions.asc \
  | gpg --dearmor > /usr/share/keyrings/erlang-solutions-archive-keyring.gpg

echo "deb [signed-by=/usr/share/keyrings/erlang-solutions-archive-keyring.gpg] \
  https://packages.erlang-solutions.com/ubuntu noble contrib" \
  | tee /etc/apt/sources.list.d/erlang-solutions.list

apt-get update
apt-get install -y --no-install-recommends esl-erlang elixir

# Install hex and rebar
mix local.hex --force
mix local.rebar --force

rm -rf /var/lib/apt/lists/*
"""

[setup]
cmd = "mix deps.get"

[container.env]
MIX_ENV = "dev"
TERM = "xterm-256color"
LANG = "en_US.UTF-8"
