# Use the same pinned, prebuilt Elixir/OTP Ubuntu Noble image as PTT.
# Erlang/Elixir are supplied by the image; OS-level development tooling is
# installed explicitly below.
[base]
image = "hexpm/elixir:1.19.5-erlang-28.5.0.1-ubuntu-noble-20260410"

[toolchain]
install = """
set -eu
export DEBIAN_FRONTEND=noninteractive

apt-get update -y
apt-get install -y --no-install-recommends \
  build-essential \
  git \
  curl \
  inotify-tools \
  locales

locale-gen en_US.UTF-8
update-locale LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8

# Bootstrap Elixir package manager and build tool.
mix local.hex --force
mix local.rebar --force

apt-get clean
rm -rf /var/lib/apt/lists/*
"""

[setup]
cmd = "mix deps.get"

[container.env]
MIX_ENV = "dev"
TERM = "xterm-256color"
LANG = "en_US.UTF-8"
PATH = "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
